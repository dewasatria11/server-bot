<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant — 9router</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary:    #ffffff;
      --bg-secondary:  #f5f5f4;
      --bg-tertiary:   #efefed;
      --text-primary:  #1a1a18;
      --text-secondary:#6b6b67;
      --text-tertiary: #a8a8a4;
      --border-light:  rgba(0,0,0,0.08);
      --border-medium: rgba(0,0,0,0.14);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg-tertiary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #chat-window {
      width: 100%;
      max-width: 740px;
      height: 90vh;
      max-height: 840px;
      background: var(--bg-primary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 2px 24px rgba(0,0,0,0.06);
    }

    #header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 20px;
      border-bottom: 0.5px solid var(--border-light);
      flex-shrink: 0;
    }

    .header-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-light);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .header-avatar svg { width: 18px; height: 18px; color: var(--text-secondary); }

    .header-info { flex: 1; }
    .header-info h1 { font-size: 15px; font-weight: 500; color: var(--text-primary); }

    #clear-btn {
      padding: 5px 12px;
      font-size: 12px;
      color: var(--text-secondary);
      background: transparent;
      border: 0.5px solid var(--border-medium);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
      font-family: var(--font);
    }
    #clear-btn:hover { background: var(--bg-secondary); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 4px; }

    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      padding: 40px 20px;
    }
    .es-icon {
      width: 50px; height: 50px;
      background: var(--bg-secondary);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
    }
    .es-icon svg { width: 24px; height: 24px; color: var(--text-tertiary); }
    #empty-state h2 { font-size: 16px; font-weight: 500; color: var(--text-primary); }
    #empty-state p { font-size: 13px; color: var(--text-secondary); max-width: 300px; line-height: 1.6; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
    .chip {
      font-size: 12px; padding: 6px 12px;
      border: 0.5px solid var(--border-medium);
      border-radius: 20px;
      background: var(--bg-primary);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font);
    }
    .chip:hover { background: var(--bg-secondary); color: var(--text-primary); }

    .msg-row {
      display: flex; align-items: flex-end; gap: 8px;
      animation: fadeUp 0.2s ease;
    }
    .msg-row.user { flex-direction: row-reverse; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-light);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .msg-avatar svg { width: 14px; height: 14px; color: var(--text-secondary); }

    .bubble {
      max-width: 72%;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.65;
      border-radius: var(--radius-lg);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.bot {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 0.5px solid var(--border-light);
      border-bottom-left-radius: 4px;
    }
    .bubble.user {
      background: var(--text-primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.image {
      padding: 8px;
      line-height: 1;
    }
    .generated-image {
      display: block;
      width: min(100%, 460px);
      border-radius: var(--radius-sm);
      cursor: zoom-in;
    }
    .bubble.error {
      background: #FCEBEB;
      border: 0.5px solid rgba(240,149,149,0.5);
      color: #A32D2D;
      border-bottom-left-radius: 4px;
    }

    .image-preview {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,0.82);
    }
    .image-preview.open { display: flex; }
    .image-preview img {
      max-width: 96vw;
      max-height: 90vh;
      border-radius: var(--radius-md);
      background: #fff;
      object-fit: contain;
    }
    .preview-close {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: #fff;
      color: var(--text-primary);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .typing { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-tertiary);
      animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40%           { opacity: 1; }
    }

    #input-area {
      padding: 12px 20px 16px;
      border-top: 0.5px solid var(--border-light);
      flex-shrink: 0;
    }
    #input-row {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-medium);
      border-radius: var(--radius-md);
      padding: 8px 8px 8px 14px;
      transition: border-color 0.15s;
    }
    #input-row:focus-within { border-color: rgba(0,0,0,0.28); }

    #attach-btn {
      width: 34px; height: 34px;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    #attach-btn:hover:not(:disabled) { background: var(--bg-tertiary); color: var(--text-primary); }
    #attach-btn:disabled { opacity: 0.35; cursor: default; }
    #attach-btn svg { width: 17px; height: 17px; }

    #user-input {
      flex: 1; border: none; background: transparent;
      font-size: 14px; color: var(--text-primary);
      font-family: var(--font);
      resize: none; outline: none;
      min-height: 22px; max-height: 120px; line-height: 1.55;
    }
    #user-input::placeholder { color: var(--text-tertiary); }

    #send-btn {
      width: 34px; height: 34px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--text-primary);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }
    #send-btn:hover:not(:disabled) { opacity: 0.82; }
    #send-btn:active:not(:disabled) { transform: scale(0.96); }
    #send-btn:disabled { opacity: 0.3; cursor: default; }
    #send-btn svg { width: 16px; height: 16px; }

    #status-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 8px;
    }
    .footer-hint { font-size: 11px; color: var(--text-tertiary); }
    #attachment-bar {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    #attachment-bar.visible { display: flex; }
    .attachment-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 5px 8px;
      border-radius: 20px;
      border: 0.5px solid var(--border-light);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-size: 11px;
      line-height: 1.2;
    }
    .attachment-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .attachment-chip button {
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
    }
    #conn-status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--bg-secondary);
      color: var(--text-tertiary);
      border: 0.5px solid var(--border-light);
    }
    #conn-status.ok    { background: #EAF3DE; color: #3B6D11; border-color: rgba(59,109,17,0.2); }
    #conn-status.error { background: #FCEBEB; color: #A32D2D; border-color: rgba(163,45,45,0.2); }

    @media (max-width: 500px) {
      body { padding: 0; }
      #chat-window { height: 100vh; max-height: 100vh; border-radius: 0; border: none; box-shadow: none; }
      .bubble { max-width: 85%; }
    }
  </style>
</head>
<body>

<div id="chat-window">
  <div id="header">
    <div class="header-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
      </svg>
    </div>
    <div class="header-info">
      <h1>AI Assistant</h1>
    </div>

    <button id="clear-btn" onclick="clearChat()">Clear</button>
  </div>

  <div id="messages">
    <div id="empty-state">
      <div class="es-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
        </svg>
      </div>
      <h2>Halo! Ada yang bisa dibantu?</h2>
      <p>Mulai chat kapan saja.</p>
      <div class="chips">
        <button class="chip" onclick="useSuggestion(this)">Ringkas ide startup AI untuk UMKM</button>
        <button class="chip" onclick="useSuggestion(this)">Buat caption Instagram yang elegan</button>
        <button class="chip" onclick="useSuggestion(this)">Susun roadmap belajar coding 30 hari</button>
        <button class="chip" onclick="useSuggestion(this)">Buatkan gambar kota futuristik saat hujan</button>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <input
        id="file-input"
        type="file"
        multiple
        hidden
        accept="image/*,.pdf,.docx,.csv,.xlsx,.xls,.txt,.md,.json,.js,.html,.css,.py"
      />
      <button id="attach-btn" type="button" title="Upload gambar atau file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.82l8.48-8.49"/>
        </svg>
      </button>
      <textarea id="user-input" rows="1" placeholder="Ketik pesan..."></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Kirim">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z"/>
        </svg>
      </button>
    </div>
    <div id="attachment-bar"></div>
    <div id="status-bar">
      <span class="footer-hint"></span>
      <span id="conn-status">Menghubungkan...</span>
    </div>
  </div>

</div>

<div class="image-preview" id="image-preview" aria-hidden="true">
  <button class="preview-close" id="preview-close" type="button" aria-label="Tutup preview">&times;</button>
  <img id="preview-image" alt="Preview gambar besar" />
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  const CONFIG = {
    baseUrl: 'https://api.alikhsan-beji.app/v1',
    apiKey: 'sk-086e224d5099c18e-2yc7lu-eb85e4ed',
    imageApiKey: 'sk-086e224d5099c18e-d7i1ob-09b48437',
    chatModel: 'cx/gpt-5.5',
    imageModel: 'cx/gpt-5.4-image',
    system: `Kamu adalah asisten AI yang ramah, cerdas, dan helpful.
Jawab dengan bahasa yang sama seperti yang digunakan pengguna (Indonesia atau Inggris).
Berikan jawaban yang jelas, ringkas, dan informatif.
Jika tidak tahu sesuatu, katakan dengan jujur.`
  };

  let history = [];
  let isLoading = false;
  let attachments = [];

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const attachBtn = document.getElementById('attach-btn');
  const fileInput = document.getElementById('file-input');
  const attachmentBar = document.getElementById('attachment-bar');
  const connStatus = document.getElementById('conn-status');
  const previewEl = document.getElementById('image-preview');
  const previewImageEl = document.getElementById('preview-image');
  const previewCloseEl = document.getElementById('preview-close');

  function getBaseUrl() {
    return CONFIG.baseUrl;
  }

  function getHeaders() {
    const headers = { 'Content-Type': 'application/json' };
    if (CONFIG.apiKey) headers.Authorization = `Bearer ${CONFIG.apiKey}`;
    return headers;
  }

  function getImageHeaders() {
    return {
      'Content-Type': 'application/json',
      'Accept': 'text/event-stream',
      'Authorization': `Bearer ${CONFIG.imageApiKey || CONFIG.apiKey}`
    };
  }

  async function checkConnection() {
    connStatus.textContent = 'Menghubungkan...';
    connStatus.className = '';

    try {
      const res = await fetch(`${getBaseUrl()}/models`, { headers: getHeaders() });
      if (res.ok) {
        connStatus.textContent = 'Terhubung';
        connStatus.className = 'ok';
      } else {
        throw new Error(String(res.status));
      }
    } catch {
      connStatus.textContent = 'Tidak terhubung';
      connStatus.className = 'error';
    }
  }

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async () => {
    const files = Array.from(fileInput.files || []);
    fileInput.value = '';
    if (!files.length) return;

    attachBtn.disabled = true;
    connStatus.textContent = 'Membaca file...';
    connStatus.className = '';

    try {
      for (const file of files) {
        attachments.push(await parseAttachment(file));
      }
      renderAttachments();
      connStatus.textContent = 'File siap';
      connStatus.className = 'ok';
    } catch (error) {
      addMessage('assistant', 'Error upload: ' + error.message, true);
      connStatus.textContent = 'Error';
      connStatus.className = 'error';
    } finally {
      attachBtn.disabled = false;
    }
  });

  function useSuggestion(el) {
    inputEl.value = el.textContent;
    inputEl.dispatchEvent(new Event('input'));
    sendMessage();
  }

  function renderAttachments() {
    attachmentBar.innerHTML = '';
    attachmentBar.classList.toggle('visible', attachments.length > 0);

    attachments.forEach((attachment, index) => {
      const chip = document.createElement('div');
      chip.className = 'attachment-chip';

      const label = document.createElement('span');
      label.textContent = `${attachment.kind === 'image' ? 'Gambar' : 'File'}: ${attachment.name}`;

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.setAttribute('aria-label', `Hapus ${attachment.name}`);
      remove.textContent = '×';
      remove.addEventListener('click', () => {
        attachments.splice(index, 1);
        renderAttachments();
      });

      chip.appendChild(label);
      chip.appendChild(remove);
      attachmentBar.appendChild(chip);
    });
  }

  function readAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error(`Gagal membaca ${file.name}`));
      reader.readAsDataURL(file);
    });
  }

  function readAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error(`Gagal membaca ${file.name}`));
      reader.readAsText(file);
    });
  }

  function readAsArrayBuffer(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error(`Gagal membaca ${file.name}`));
      reader.readAsArrayBuffer(file);
    });
  }

  async function parsePdf(file) {
    if (!window.pdfjsLib) throw new Error('PDF.js belum termuat.');
    const data = await readAsArrayBuffer(file);
    const pdf = await pdfjsLib.getDocument({ data }).promise;
    const pages = [];

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const content = await page.getTextContent();
      const text = content.items.map((item) => item.str).join(' ');
      pages.push(`Halaman ${pageNum}:\n${text}`);
    }

    return pages.join('\n\n');
  }

  async function parseDocx(file) {
    if (!window.mammoth) throw new Error('Mammoth DOCX belum termuat.');
    const arrayBuffer = await readAsArrayBuffer(file);
    const result = await mammoth.extractRawText({ arrayBuffer });
    return result.value || '';
  }

  async function parseSpreadsheet(file) {
    if (!window.XLSX) throw new Error('SheetJS belum termuat.');
    const arrayBuffer = await readAsArrayBuffer(file);
    const workbook = XLSX.read(arrayBuffer, { type: 'array' });

    return workbook.SheetNames.map((sheetName) => {
      const csv = XLSX.utils.sheet_to_csv(workbook.Sheets[sheetName]);
      return `Sheet: ${sheetName}\n${csv}`;
    }).join('\n\n');
  }

  async function parseAttachment(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    const maxBytes = 12 * 1024 * 1024;
    if (file.size > maxBytes) {
      throw new Error(`${file.name} terlalu besar. Maksimal 12 MB per file.`);
    }

    if (file.type.startsWith('image/')) {
      return {
        kind: 'image',
        name: file.name,
        mime: file.type,
        dataUrl: await readAsDataURL(file)
      };
    }

    let text = '';
    if (ext === 'pdf') text = await parsePdf(file);
    else if (ext === 'docx') text = await parseDocx(file);
    else if (ext === 'xlsx' || ext === 'xls') text = await parseSpreadsheet(file);
    else text = await readAsText(file);

    text = String(text || '').trim();
    if (!text) throw new Error(`${file.name} tidak berisi teks yang bisa dibaca.`);

    return {
      kind: 'text',
      name: file.name,
      text
    };
  }

  function buildUserContent(text, currentAttachments) {
    const textAttachments = currentAttachments.filter((attachment) => attachment.kind === 'text');
    const imageAttachments = currentAttachments.filter((attachment) => attachment.kind === 'image');
    const fileContext = textAttachments.map((attachment) => {
      const limitedText = attachment.text.length > 60000
        ? attachment.text.slice(0, 60000) + '\n\n[Isi file dipotong karena terlalu panjang.]'
        : attachment.text;
      return `--- ${attachment.name} ---\n${limitedText}`;
    }).join('\n\n');
    const fullText = fileContext
      ? `${text}\n\nGunakan isi file berikut sebagai konteks:\n\n${fileContext}`
      : text;

    if (!imageAttachments.length) return fullText;

    return [
      { type: 'text', text: fullText },
      ...imageAttachments.map((attachment) => ({
        type: 'image_url',
        image_url: { url: attachment.dataUrl }
      }))
    ];
  }

  function openImagePreview(src) {
    previewImageEl.src = src;
    previewEl.classList.add('open');
    previewEl.setAttribute('aria-hidden', 'false');
  }

  function closeImagePreview() {
    previewEl.classList.remove('open');
    previewEl.setAttribute('aria-hidden', 'true');
    previewImageEl.removeAttribute('src');
  }

  previewEl.addEventListener('click', (event) => {
    if (event.target === previewEl) closeImagePreview();
  });

  previewCloseEl.addEventListener('click', closeImagePreview);

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && previewEl.classList.contains('open')) {
      closeImagePreview();
    }
  });

  function detectImageIntent(text) {
    const trimmed = text.trim();
    const commandMatch = trimmed.match(/^\/(?:gambar|image|img|foto|draw)\s+(.+)/i);
    if (commandMatch) {
      return { isImage: true, prompt: commandMatch[1].trim() };
    }

    const imagePatterns = [
      /^(tolong\s+)?(buatkan|buat|bikin|generate|ciptakan)\s+(sebuah\s+)?(gambar|foto|image|ilustrasi|poster|logo|desain|visual)\b/i,
      /^(create|generate|make|draw)\s+(an?\s+)?(image|picture|photo|illustration|poster|logo|design)\b/i
    ];

    return {
      isImage: imagePatterns.some((pattern) => pattern.test(trimmed)),
      prompt: trimmed
    };
  }

  function hideEmptyState() {
    const es = document.getElementById('empty-state');
    if (es) es.style.display = 'none';
  }

  function botAvatarSVG() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
    </svg>`;
  }

  function addMessage(role, text, isError = false) {
    hideEmptyState();
    const row = document.createElement('div');
    row.className = 'msg-row ' + (role === 'user' ? 'user' : 'bot');

    if (role === 'assistant') {
      const av = document.createElement('div');
      av.className = 'msg-avatar';
      av.innerHTML = botAvatarSVG();
      row.appendChild(av);
    }

    const bubble = document.createElement('div');
    bubble.className = isError ? 'bubble error' : 'bubble ' + role;
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addImageMessage(base64, format = 'png') {
    hideEmptyState();
    const row = document.createElement('div');
    row.className = 'msg-row bot';

    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.innerHTML = botAvatarSVG();

    const bubble = document.createElement('div');
    bubble.className = 'bubble bot image';

    const img = document.createElement('img');
    img.className = 'generated-image';
    img.alt = 'Gambar hasil generate';
    img.src = `data:image/${format};base64,${base64}`;
    img.addEventListener('click', () => openImagePreview(img.src));

    bubble.appendChild(img);
    row.appendChild(av);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTyping() {
    hideEmptyState();
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-row';
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.innerHTML = botAvatarSVG();
    const bubble = document.createElement('div');
    bubble.className = 'bubble bot typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(av);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  function clearChat() {
    history = [];
    attachments = [];
    renderAttachments();
    messagesEl.innerHTML = `
      <div id="empty-state" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:40px 20px;">
        <div class="es-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
          </svg>
        </div>
        <h2>Chat dibersihkan</h2>
        <p>Mulai percakapan baru kapan saja.</p>
      </div>`;
  }

  function extractReplyFromSSE(raw) {
    let text = '';
    const lines = raw.split('\n');
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const payload = line.slice(6).trim();
      if (!payload || payload === '[DONE]') continue;
      try {
        const chunk = JSON.parse(payload);
        text += chunk?.choices?.[0]?.delta?.content || '';
      } catch {
        // ignore non-JSON chunks
      }
    }
    return text;
  }

  function extractImageFromSSE(raw) {
    const lines = raw.split('\n');
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const payload = line.slice(6).trim();
      if (!payload || payload === '[DONE]') continue;
      try {
        const chunk = JSON.parse(payload);
        const image = chunk?.data?.[0]?.b64_json || chunk?.output?.[0]?.result;
        if (image) return image;
      } catch {
        // ignore non-JSON chunks
      }
    }
    return '';
  }

  async function generateImage(prompt) {
    const res = await fetch(`${getBaseUrl()}/images/generations`, {
      method: 'POST',
      headers: getImageHeaders(),
      body: JSON.stringify({
        model: CONFIG.imageModel,
        prompt,
        n: 1,
        size: 'auto',
        quality: 'low',
        background: 'auto',
        image_detail: 'low',
        output_format: 'png'
      })
    });

    const raw = await res.text();

    if (!res.ok) {
      let errMsg = `Server error ${res.status}`;
      try {
        const errJson = JSON.parse(raw);
        errMsg = errJson?.error?.message || errMsg;
      } catch {
        if (raw) errMsg = raw.slice(0, 200);
      }
      throw new Error(errMsg);
    }

    if (raw.includes('data: ')) {
      const image = extractImageFromSSE(raw);
      if (image) return image;
    }

    const data = JSON.parse(raw);
    return data?.data?.[0]?.b64_json || '';
  }

  async function sendMessage() {
    if (isLoading) return;
    const typedText = inputEl.value.trim();
    if (!typedText && !attachments.length) return;

    const currentAttachments = [...attachments];
    const text = typedText || 'Jelaskan isi file atau gambar yang saya upload.';
    const attachmentNames = currentAttachments.map((attachment) => attachment.name);
    const displayText = attachmentNames.length
      ? `${text}\n\nLampiran: ${attachmentNames.join(', ')}`
      : text;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    attachments = [];
    renderAttachments();
    sendBtn.disabled = true;
    attachBtn.disabled = true;
    isLoading = true;

    addMessage('user', displayText);
    addTyping();
    let pushedUserToHistory = false;
    const intent = detectImageIntent(text);

    try {
      if (intent.isImage) {
        const image = await generateImage(intent.prompt);
        removeTyping();
        if (!image) throw new Error('Respons gambar kosong.');
        addImageMessage(image, 'png');
        connStatus.textContent = 'Terhubung';
        connStatus.className = 'ok';
        return;
      }

      const userContent = buildUserContent(text, currentAttachments);
      history.push({ role: 'user', content: userContent });
      pushedUserToHistory = true;
      const messages = [{ role: 'system', content: CONFIG.system }, ...history];
      const res = await fetch(`${getBaseUrl()}/chat/completions`, {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({
          model: CONFIG.chatModel,
          max_tokens: 1024,
          messages
        })
      });

      const contentType = res.headers.get('content-type') || '';
      const raw = await res.text();
      removeTyping();

      if (!res.ok) {
        let errMsg = `Server error ${res.status}`;
        try {
          const errJson = JSON.parse(raw);
          errMsg = errJson?.error?.message || errMsg;
        } catch {
          if (raw) errMsg = raw.slice(0, 200);
        }
        addMessage('assistant', 'Error: ' + errMsg, true);
        if (pushedUserToHistory) history.pop();
        connStatus.textContent = 'Error';
        connStatus.className = 'error';
        return;
      }

      let reply = '(Tidak ada respons)';
      if (contentType.includes('text/event-stream') || raw.includes('data: ')) {
        const sseReply = extractReplyFromSSE(raw);
        if (sseReply) reply = sseReply;
      } else {
        try {
          const data = JSON.parse(raw);
          reply = data?.choices?.[0]?.message?.content || reply;
        } catch {
          if (raw.trim()) reply = raw.trim();
        }
      }

      history.push({ role: 'assistant', content: reply });
      addMessage('assistant', reply);
      connStatus.textContent = 'Terhubung';
      connStatus.className = 'ok';

    } catch (err) {
      removeTyping();
      addMessage('assistant',
        'Error: ' + (err.message || 'Gagal terhubung ke 9router. Pastikan endpoint aktif dan API key sesuai jika dibutuhkan.'),
        true
      );
      if (pushedUserToHistory) history.pop();
      connStatus.textContent = 'Tidak terhubung';
      connStatus.className = 'error';
      console.error('[9router] Fetch error:', err);
    } finally {
      sendBtn.disabled = false;
      attachBtn.disabled = false;
      isLoading = false;
      inputEl.focus();
    }
  }

  checkConnection();
  inputEl.focus();
</script>
